name: riverpod_clean_architecture
description: "Riverpod clean architecture Flutter template."
publish_to: 'none'

# Release builds read the version from here. CI fails a release tag (vX.Y.Z)
# that doesn't match the X.Y.Z part below.
version: 1.0.0+1

environment:
  sdk: ^3.13.7
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management + DI
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Networking + models
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Navigation
  go_router: ^18.1.3

  # Storage
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  # Platform / utils
  connectivity_plus: ^7.3.2
  logger: ^2.8.0
  intl: ^0.20.3
  flutter_svg: ^2.3.2
  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation (see build.yaml). Run `make gen` or keep `make watch` running.
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  go_router_builder: ^4.5.3
  flutter_gen_runner: ^5.15.0

  # Testing
  mocktail: ^1.0.5

  # Tooling
  flutter_launcher_icons: ^0.14.4
  path: ^1.9.1
  image: ^4.12.0
  source_gen: ^4.3.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/

# Generates lib/gen/assets.gen.dart → `Assets.images.logo.image()`
flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
