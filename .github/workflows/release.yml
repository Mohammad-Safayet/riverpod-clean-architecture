# Ships prod to Play internal track + TestFlight when a version tag is pushed:
#   1. bump `version:` in pubspec.yaml (e.g. 1.2.0+12), commit
#   2. git tag v1.2.0 && git push --tags
# Promotion to production stays manual (Play Console / App Store Connect, or the
# `promote_production` lane). Secrets: docs/architecture/release.md.
name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches pubspec version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          echo "pubspec: $version, tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag v$tag does not match pubspec.yaml version $version. Bump pubspec or retag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    name: Android → Play internal
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: Signing files from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
          echo "$PLAY_JSON" > android/play-store-credentials.json

      - name: Build app bundle
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build
          flutter build appbundle --release --flavor prod -t lib/main_prod.dart --obfuscate --split-debug-info=build/symbols/android

      # Needed to read obfuscated stack traces (`flutter symbolize`, or upload to
      # Sentry/Crashlytics). Keep them for every release you ship.
      - name: Keep debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: symbols-android-${{ github.ref_name }}
          path: |
            build/symbols/android
            build/app/outputs/mapping/prodRelease/mapping.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Upload to Play internal track
        working-directory: android
        run: bundle exec fastlane deploy_internal

  ios:
    name: iOS → TestFlight
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Generate code
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          FLUTTER: flutter
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec fastlane deploy_beta

      - name: Keep debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symbols-ios-${{ github.ref_name }}
          path: build/symbols/ios
          retention-days: 90
          if-no-files-found: warn
