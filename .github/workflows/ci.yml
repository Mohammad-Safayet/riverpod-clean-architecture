name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Reads the Flutter version from pubspec.yaml (environment.flutter), kept in
      # sync with .fvmrc.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install packages
        run: flutter pub get

      # Generated files aren't committed, so CI builds them like `make gen`.
      - name: Generate code
        run: |
          flutter gen-l10n
          dart run build_runner build

      - name: Format
        run: dart run tool/format_check.dart

      - name: Localization
        run: dart run tool/l10n_check.dart

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
